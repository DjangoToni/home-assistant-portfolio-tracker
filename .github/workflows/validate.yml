name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  syntax:
    name: Python and JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install supported Home Assistant
        run: python -m pip install "homeassistant==2026.9.1"
      - name: Import integration with Home Assistant
        run: python -c "import custom_components.portfolio_tracker, custom_components.portfolio_tracker.binary_sensor, custom_components.portfolio_tracker.config_flow, custom_components.portfolio_tracker.sensor"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run portfolio manager regression tests
        run: python -m pytest -q tests/test_portfolio_manager.py
      - name: Compile Python
        run: python -m compileall -q custom_components/portfolio_tracker
      - name: Validate JSON
        run: python -c "import json,pathlib; [json.loads(path.read_text(encoding='utf-8')) for path in pathlib.Path('.').rglob('*.json')]"
